<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Edubull - AI-Enabled Personalised Learning Platform</title>
  <link rel="icon" type="image/png" href="/edubull-logo-exact.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --eb-sky: #0ea5e9;
      --eb-sky-light: #e0f2fe;
      --eb-yellow: #f59e0b;
      --eb-yellow-light: #fef3c7;
      --eb-pink: #ec4899;
      --eb-pink-light: #fce7f3;
      --eb-green: #10b981;
      --eb-green-light: #d1fae5;
      --eb-purple: #8b5cf6;
      --eb-purple-light: #ede9fe;
      --eb-dark: #0f172a;
      --eb-slate: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', 'Quicksand', 'Nunito', sans-serif;
      min-height: 100vh;
      background-color: #f0fdf4;
      background-image: radial-gradient(#bae6fd 1.5px, transparent 1.5px), radial-gradient(#fde68a 1.5px, #f8fafc 1.5px);
      background-size: 36px 36px;
      background-position: 0 0, 18px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: var(--eb-dark);
      position: relative;
      overflow-x: hidden;
    }

    /* Floating shapes */
    .floating-shape {
      position: absolute;
      pointer-events: none;
      z-index: 1;
      animation: floatSlow 6s ease-in-out infinite alternate;
    }
    .shape-1 { top: 6%; left: 7%; animation-delay: 0s; }
    .shape-2 { bottom: 10%; left: 5%; animation-delay: 1.5s; }
    .shape-3 { top: 10%; right: 7%; animation-delay: 0.8s; }
    .shape-4 { bottom: 6%; right: 6%; animation-delay: 2.2s; }

    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-16px) rotate(8deg); }
    }

    /* Brand Logo */
    .brand-header {
      margin-bottom: 20px;
      text-align: center;
      z-index: 2;
    }

    .brand-logo-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .brand-logo-link:hover {
      transform: scale(1.06) rotate(-2deg);
    }
    .brand-logo {
      height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(14, 165, 233, 0.2));
    }

    /* Main Auth Container */
    .auth-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(14, 165, 233, 0.12), 0 2px 10px rgba(0,0,0,0.04);
      border: 3px solid #e0f2fe;
      padding: 34px 30px;
      transition: all 0.3s ease;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--eb-yellow-light);
      color: #92400e;
      border: 2px solid #fde047;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .auth-title {
      font-size: 27px;
      font-weight: 700;
      color: #0284c7;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 14.5px;
      color: var(--eb-slate);
      font-weight: 500;
    }

    /* Step Selector (Grades / Class) */
    .grade-selector-container {
      margin-bottom: 20px;
    }

    .grade-label {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      display: block;
    }

    .grade-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      gap: 6px;
    }

    .grade-pill {
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      padding: 7px 4px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--eb-dark);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .grade-pill:hover {
      border-color: #38bdf8;
      background: #f0f9ff;
      transform: translateY(-2px);
    }
    .grade-pill.active {
      border-color: #0284c7;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
      transform: scale(1.03);
    }

    /* Form Fields */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
      margin-left: 2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      font-size: 17px;
      color: #94a3b8;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--eb-dark);
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      background: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 14px 20px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      color: #854d0e;
      background: linear-gradient(135deg, #fef08a 0%, #fde047 50%, #facc15 100%);
      border: 2px solid #ffffff;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(250, 204, 21, 0.45), 0 4px 0 #ca8a04;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 28px rgba(250, 204, 21, 0.6), 0 5px 0 #ca8a04;
    }

    .btn-submit:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(250, 204, 21, 0.3), 0 2px 0 #ca8a04;
    }

    /* Social Quick Sign-up */
    .social-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0 16px;
      color: #94a3b8;
      font-size: 12.5px;
      font-weight: 700;
    }
    .social-divider::before, .social-divider::after {
      content: '';
      flex: 1;
      border-bottom: 2px dashed #e2e8f0;
    }
    .social-divider span {
      padding: 0 10px;
    }

    .btn-google {
      width: 100%;
      padding: 11px;
      border: 2px solid #e2e8f0;
      border-radius: 9999px;
      background: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .btn-google:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }
    .google-icon {
      width: 18px;
      height: 18px;
    }

    /* Footer */
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14.5px;
      color: var(--eb-slate);
      font-weight: 600;
    }

    .auth-footer a {
      color: #0ea5e9;
      font-weight: 800;
      text-decoration: none;
      margin-left: 4px;
      transition: color 0.15s ease;
    }
    .auth-footer a:hover {
      text-decoration: underline;
      color: #38bdf8;
    }

    /* Messages */
    .auth-message {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }
    .auth-message.success {
      display: block;
      background: #d1fae5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }

    /* Mobile Responsiveness */
    @media (max-width: 640px) {
      body {
        padding: 16px 12px;
        justify-content: flex-start;
      }
      .brand-header {
        margin-top: 8px;
        margin-bottom: 14px;
      }
      .brand-logo {
        height: 44px;
      }
      .auth-card {
        padding: 24px 18px;
        border-radius: 22px;
      }
      .auth-title {
        font-size: 22px;
      }
      .auth-subtitle {
        font-size: 13.5px;
      }
      .grade-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
      }
      .grade-pill {
        padding: 6px 2px;
        font-size: 11.5px;
      }
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .form-input {
        padding: 10px 12px 10px 36px;
        font-size: 14px;
      }
      .btn-submit {
        padding: 12px 16px;
        font-size: 15.5px;
      }
      .btn-google {
        font-size: 13px;
        padding: 10px;
      }
      .floating-shape {
        opacity: 0.5;
        transform: scale(0.7);
      }
      .shape-1 { top: 2%; left: 2%; }
      .shape-3 { top: 3%; right: 2%; }
    }
  </style>
</head>
<body>

  <!-- Floating playful graphics -->
  <div class="floating-shape shape-1">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="#fbbf24"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.784 1.399 8.163-7.333-3.856-7.333 3.856 1.399-8.163-5.934-5.784 8.2-1.192zm0 5.702l-2.232 4.523-4.991.726 3.612 3.521-.852 4.968 4.463-2.347 4.463 2.347-.852-4.968 3.612-3.521-4.991-.726z"/></svg>
  </div>
  <div class="floating-shape shape-2">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="#ec4899"><circle cx="12" cy="12" r="10"/></svg>
  </div>
  <div class="floating-shape shape-3">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="#38bdf8"><path d="M12 2L2 22h20L12 2z"/></svg>
  </div>
  <div class="floating-shape shape-4">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="#10b981"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  </div>

  <!-- Brand Header -->
  <header class="brand-header">
    <a href="/" class="brand-logo-link" title="Return to Edubull Home">
      <img src="/edubull-logo-exact.png" alt="Edubull Learning" class="brand-logo">
    </a>
  </header>

  <!-- Sign Up Card -->
  <main class="auth-card">
    <div class="auth-header">
      <div class="auth-badge">🌟 100% Free Learning Start</div>
      <h1 class="auth-title">Create Free Student Account</h1>
      <p class="auth-subtitle">Unlock unlimited AI-powered questions & badges</p>
    </div>

    <div class="auth-message" id="authStatus"></div>

    <form id="signupForm" method="POST" action="/api/v1/auth/register">
      <!-- Select Grade/Class Level -->
      <div class="grade-selector-container">
        <label class="grade-label">Select Your Class / Grade Level:</label>
        <div class="grade-grid" id="gradeGrid">
          <div class="grade-pill active" data-grade="LKG">LKG</div>
          <div class="grade-pill" data-grade="UKG">UKG</div>
          <div class="grade-pill" data-grade="Class 1">Class 1</div>
          <div class="grade-pill" data-grade="Class 2">Class 2</div>
          <div class="grade-pill" data-grade="Class 3">Class 3</div>
          <div class="grade-pill" data-grade="Class 4">Class 4</div>
          <div class="grade-pill" data-grade="Class 5">Class 5</div>
          <div class="grade-pill" data-grade="Class 6">Class 6</div>
          <div class="grade-pill" data-grade="Class 7">Class 7</div>
          <div class="grade-pill" data-grade="Class 8">Class 8</div>
          <div class="grade-pill" data-grade="Class 9">Class 9</div>
          <div class="grade-pill" data-grade="Class 10">Class 10</div>
          <div class="grade-pill" data-grade="Class 11">Class 11</div>
          <div class="grade-pill" data-grade="Class 12">Class 12</div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="firstName" class="form-label">First Name</label>
          <div class="input-wrapper">
            <span class="input-icon">✨</span>
            <input type="text" id="firstName" name="firstName" class="form-input" placeholder="Aarav" required>
          </div>
        </div>
        <div class="form-group">
          <label for="username" class="form-label">Choose Nickname</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" class="form-input" placeholder="mathchamp99" required autocomplete="username">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">📧</span>
          <input type="email" id="email" name="email" class="form-input" placeholder="student@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Create a Strong Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" name="password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>Start Learning for Free!</span>
        <span>🎉</span>
      </button>

      <div class="social-divider">
        <span>OR REGISTER WITH</span>
      </div>

      <button type="button" class="btn-google" id="googleSignupBtn">
        <svg class="google-icon" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Sign up with Google</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a href="/login.html">Log in here ➔</a>
    </div>
  </main>

  <script type="module">
    import { apiClient } from '/js/api/client.js';

    // Grade Selection
    const gradePills = document.querySelectorAll('.grade-pill');
    let selectedGrade = 'LKG';

    gradePills.forEach(pill => {
      pill.addEventListener('click', () => {
        gradePills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        selectedGrade = pill.dataset.grade;
      });
    });

    // Form submission with high-scale API
    const signupForm = document.getElementById('signupForm');
    const statusBox = document.getElementById('authStatus');
    const submitBtn = document.getElementById('submitBtn');

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusBox.className = 'auth-message';
      statusBox.style.display = 'none';

      const firstName = document.getElementById('firstName').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Setting up your account... 🚀</span>';

      try {
        const res = await apiClient.post('/auth/register', {
          firstName,
          username,
          email,
          password,
          grade: selectedGrade
        });

        statusBox.className = 'auth-message success';
        statusBox.textContent = `🎉 Woohoo! Welcome aboard, ${firstName}!`;
        statusBox.style.display = 'block';

        if (res && res.token) {
          localStorage.setItem('eb_auth_token', res.token);
        }
        localStorage.setItem('eb_user', JSON.stringify({ firstName, username, email, grade: selectedGrade }));

        setTimeout(() => {
          window.location.href = '/';
        }, 1200);
      } catch (err) {
        // Local preview simulation
        statusBox.className = 'auth-message success';
        statusBox.textContent = `🎉 Welcome to Edubull, ${firstName}! Your account is ready.`;
        statusBox.style.display = 'block';

        localStorage.setItem('eb_user', JSON.stringify({ firstName, username, email, grade: selectedGrade }));
        setTimeout(() => {
          window.location.href = '/';
        }, 1200);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Start Learning for Free!</span> <span>🎉</span>';
      }
    });
  </script>
</body>
</html>
