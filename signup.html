<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — Edubull</title>
  <link rel="icon" href="/edubull-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/edubull.css">
</head>
<body>
<div class="auth">
  <aside class="auth-side">
    <a class="logo" href="/"><span class="logo-mark">eb</span>edubull</a>
    <div>
      <h2>Learning that grows with you.</h2>
      <p>Set up a free account and get practice matched to your class in under a minute.</p>
    </div>
    <p style="font-size:.85rem;opacity:.7">LKG to Class 12 · Instant feedback · SmartScore</p>
  </aside>
  <main class="auth-main">
    <div class="auth-box">
      <a class="logo" href="/"><span class="logo-mark">eb</span>edubull</a>
      <h1 style="font-size:2rem">Create your account</h1>
      <p class="muted">Already have one? <a href="/login.html">Sign in</a>.</p>
      <form id="form" novalidate>
        <div class="row-2">
          <div class="field"><label for="firstName">Learner's first name</label><input class="input" id="firstName" autocomplete="given-name" required></div>
          <div class="field"><label for="username">Username</label><input class="input" id="username" autocomplete="username" required></div>
        </div>
        <div class="field"><label for="email">Parent's email</label><input class="input" id="email" type="email" autocomplete="email" required></div>
        <div class="field">
          <label for="password">Password <span class="muted" style="font-weight:400">(8+ characters)</span></label>
          <div class="pw-wrap">
            <input class="input" id="password" type="password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="pw-toggle" data-toggle="password">Show</button>
          </div>
        </div>
        <div class="field">
          <label id="gradeLabel">Class</label>
          <div class="chips" id="grades" role="group" aria-labelledby="gradeLabel"></div>
        </div>
        <div class="feedback" id="msg" hidden></div>
        <button class="btn btn-primary btn-block btn-lg" id="submit" style="margin-top:8px">Create free account</button>
      </form>
    </div>
  </main>
</div>
<script type="module">
  import { apiClient } from '/js/api/client.js';
  import { GRADES, esc } from '/js/ui/dom.js';
  import '/js/ui/auth.js';

  let grade = 'class-1';
  const chips = document.getElementById('grades');
  chips.innerHTML = GRADES.map(g => `<button type="button" class="chip" data-g="${g.key}" aria-pressed="${g.key === grade}">${esc(g.label)}</button>`).join('');
  chips.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    grade = c.dataset.g;
    chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
  });

  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit');
  const fail = text => { msg.hidden = false; msg.className = 'feedback bad'; msg.textContent = text; };

  form.addEventListener('submit', async e => {
    e.preventDefault();
    msg.hidden = true;
    const body = {
      firstName: form.firstName.value.trim(), username: form.username.value.trim(),
      email: form.email.value.trim(), password: form.password.value, grade
    };
    if (!body.firstName || !body.username) return fail('Please fill in a name and username.');
    if (!form.email.checkValidity()) return fail('Please enter a valid email address.');
    if (body.password.length < 8) return fail('Password needs at least 8 characters.');

    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      const res = await apiClient.post('/auth/register', body);
      if (res?.token) localStorage.setItem('eb_auth_token', res.token);
      localStorage.setItem('eb_user', JSON.stringify(res?.user || { firstName: body.firstName, username: body.username, grade }));
      location.href = `/class.html?grade=${grade}`;
    } catch {
      fail("We couldn't create your account right now. Please try again shortly.");
      btn.disabled = false; btn.textContent = 'Create free account';
    }
  });
</script>
</body>
</html>
