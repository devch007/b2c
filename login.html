<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Edubull</title>
  <link rel="icon" href="/edubull-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/edubull.css">
</head>
<body>
<div class="auth">
  <aside class="auth-side">
    <a class="logo" href="/"><span class="logo-mark">eb</span>edubull</a>
    <div>
      <h2>Welcome back.</h2>
      <p>Pick up right where you left off. Your SmartScores are waiting.</p>
    </div>
    <p style="font-size:.85rem;opacity:.7">LKG to Class 12 · Instant feedback · SmartScore</p>
  </aside>
  <main class="auth-main">
    <div class="auth-box">
      <a class="logo" href="/"><span class="logo-mark">eb</span>edubull</a>
      <h1 style="font-size:2rem">Sign in</h1>
      <p class="muted">New here? <a href="/signup.html">Create a free account</a>.</p>
      <form id="form" novalidate>
        <div class="field">
          <label for="username">Username or email</label>
          <input class="input" id="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input class="input" id="password" type="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" data-toggle="password">Show</button>
          </div>
        </div>
        <div class="feedback" id="msg" hidden></div>
        <button class="btn btn-primary btn-block btn-lg" id="submit" style="margin-top:8px">Sign in</button>
      </form>
      <p class="alt"><a href="/">← Back to home</a></p>
    </div>
  </main>
</div>
<script type="module">
  import { apiClient } from '/js/api/client.js';
  import '/js/ui/auth.js';

  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const username = form.username.value.trim();
    const password = form.password.value;
    msg.hidden = true;
    if (!username || !password) {
      msg.hidden = false; msg.className = 'feedback bad';
      msg.textContent = 'Please enter your username and password.';
      return;
    }
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const res = await apiClient.post('/auth/login', { username, password });
      if (!res?.token) throw new Error('No session returned');
      localStorage.setItem('eb_auth_token', res.token);
      localStorage.setItem('eb_user', JSON.stringify(res.user || { username }));
      location.href = '/';
    } catch {
      msg.hidden = false; msg.className = 'feedback bad';
      msg.textContent = "We couldn't sign you in. Check your details and try again.";
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
