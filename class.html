<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curriculum — Edubull</title>
  <link rel="icon" href="/edubull-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/edubull.css">
</head>
<body>
  <header data-site-header></header>

  <main class="wrap">
    <section class="page-head">
      <span class="eyebrow">Curriculum</span>
      <h1 id="title" style="font-size:clamp(2rem,4.5vw,3.2rem)">Maths skills</h1>
      <p class="muted" id="desc" style="max-width:680px"></p>
    </section>

    <nav class="grade-tabs" id="tabs" aria-label="Choose a grade"></nav>

    <div class="toolbar">
      <label class="sr-only" for="filter">Filter skills</label>
      <input id="filter" class="search-input" style="padding-left:16px" type="search" placeholder="Filter skills in this class…">
      <span class="muted" id="count" style="font-size:.9rem"></span>
    </div>

    <div class="cat-grid" id="grid">
      <div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </main>

  <footer data-site-footer></footer>

  <script type="module">
    import '/js/ui/layout.js';
    import { curriculumApi } from '/js/api/curriculum.api.js';
    import { GRADES, findGrade, esc } from '/js/ui/dom.js';

    const params = new URLSearchParams(location.search);
    const grade = findGrade((params.get('grade') || 'class-1').toLowerCase());

    // Search results link here with ?skill=; send them straight to practice.
    if (params.get('skill')) {
      location.replace(`/app.html?grade=${grade.key}&skill=${encodeURIComponent(params.get('skill'))}`);
    }

    document.getElementById('tabs').innerHTML = GRADES.map(g => `
      <a class="grade-tab" href="?grade=${g.key}"${g.key === grade.key ? ' aria-current="page"' : ''}>${esc(g.label)}</a>`).join('');
    document.querySelector('.grade-tab[aria-current]')?.scrollIntoView({ inline: 'center', block: 'nearest' });

    const grid = document.getElementById('grid');
    let categories = [];

    function render(filter = '') {
      const q = filter.trim().toLowerCase();
      let total = 0;
      const html = categories.map(cat => {
        const skills = (cat.skills || []).filter(s => !q || s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q));
        total += skills.length;
        if (!skills.length) return '';
        return `
          <section class="cat">
            <h3><span class="ico">${esc(cat.icon || '📘')}</span>${esc(cat.name)}</h3>
            <ul class="skill-list">
              ${skills.map(s => `
                <li><a class="skill-link" href="/app.html?grade=${grade.key}&skill=${encodeURIComponent(s.id)}&name=${encodeURIComponent(s.name)}">
                  <span class="skill-id">${esc(s.id)}</span>
                  <span class="skill-name">${esc(s.name)}</span>
                  <span class="skill-go">Practise →</span>
                </a></li>`).join('')}
            </ul>
          </section>`;
      }).join('');
      grid.innerHTML = html || `<div class="empty">No skills match “${esc(filter)}”.</div>`;
      document.getElementById('count').textContent = `${total} skill${total === 1 ? '' : 's'}`;
    }

    try {
      const data = await curriculumApi.getClassSkills(grade.key);
      document.title = `${data.title || grade.label} — Edubull`;
      document.getElementById('title').textContent = data.title || `${grade.label} Maths`;
      document.getElementById('desc').textContent = data.description || '';
      categories = data.categories || [];
      render();
    } catch (err) {
      grid.innerHTML = `<div class="empty">We couldn't load this class. Please refresh to try again.</div>`;
    }

    document.getElementById('filter').addEventListener('input', e => render(e.target.value));
  </script>
</body>
</html>
