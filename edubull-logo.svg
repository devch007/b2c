<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="100%" height="100%">
  <defs>
    <!-- Gradient for the eb rounded badge -->
    <linearGradient id="edubullIconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3c96" />
      <stop offset="35%" stop-color="#2d52bd" />
      <stop offset="65%" stop-color="#6f42c1" />
      <stop offset="85%" stop-color="#e85d04" />
      <stop offset="100%" stop-color="#f48c06" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3c96" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Icon Rounded Box with Sunset to Royal Blue Gradient -->
  <rect x="5" y="5" width="80" height="80" rx="20" ry="20" fill="url(#edubullIconGrad)" filter="url(#badgeShadow)" />
  
  <!-- 'eb' stylized typography inside badge with infinity loop touch -->
  <!-- 'e' lowercase smooth curve -->
  <g fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- e loop -->
    <path d="M 44 48 C 44 38, 30 36, 25 43 C 20 50, 24 60, 36 60 C 43 60, 48 56, 50 51 M 23 47 L 44 47" />
    <!-- b stem and bowl flowing from e -->
    <path d="M 49 22 L 49 58 C 49 58, 51 60, 58 60 C 67 60, 71 52, 71 45 C 71 37, 65 33, 56 33 C 51 33, 49 36, 49 39" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="106" y1="14" x2="106" y2="76" stroke="#d0d7de" stroke-width="2" stroke-linecap="round" />

  <!-- Main Brand Name "edubull" in vibrant royal blue / purple brand tone -->
  <text x="122" y="56" font-family="'Quicksand', 'Fredoka', 'Nunito', 'Comfortaa', sans-serif" font-size="52" font-weight="900" fill="#3b52aa" letter-spacing="-1.5">edubull</text>

  <!-- Tagline: "Creating AI Enabled Schools" with glowing AI highlight -->
  <text x="124" y="75" font-family="'Quicksand', 'Nunito', 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#1b254b" letter-spacing="0.6">
    Creating <tspan fill="#ff7a00" font-weight="800">AI Enabled</tspan> Schools
  </text>
</svg>
