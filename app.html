<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice — Edubull</title>
  <link rel="icon" href="/edubull-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/edubull.css">
</head>
<body>
  <header data-site-header></header>

  <main class="wrap">
    <div class="practice">
      <div>
        <div class="crumbs"><a href="/class.html" id="crumbGrade">Class 1</a> / <span id="crumbSkill">Practice</span></div>
        <div class="q-card" id="card">
          <div class="progress"><i id="bar"></i></div>
          <div class="q-meta"><span id="qNum">Loading…</span><span id="skillTag"></span></div>
          <div id="stage"><div class="skeleton" style="height:180px"></div></div>
        </div>
      </div>

      <aside class="side">
        <div class="stat" style="text-align:center">
          <div class="stat-label">SmartScore</div>
          <div class="ring" id="ring"><span id="score">0</span></div>
          <p class="muted" style="font-size:.85rem;margin:12px 0 0">Reach 100 to master this skill.</p>
        </div>
        <div class="stat">
          <div class="stat-label">This session</div>
          <div class="stat-value" id="tally">0<small> / 0 correct</small></div>
        </div>
        <a class="btn btn-ghost btn-block" id="backLink" href="/class.html">← All skills</a>
      </aside>
    </div>
  </main>

  <footer data-site-footer></footer>

  <script type="module">
    import '/js/ui/layout.js';
    import { apiClient } from '/js/api/client.js';
    import { findGrade, esc } from '/js/ui/dom.js';

    const SESSION_LENGTH = 10;
    const params = new URLSearchParams(location.search);
    const grade = findGrade(params.get('grade') || 'class-1');
    const skillId = params.get('skill') || 'A.1';
    const skillName = params.get('name') || `Skill ${skillId}`;
    const scoreKey = `eb_score_${grade.key}_${skillId}`;

    const $ = id => document.getElementById(id);
    $('crumbGrade').textContent = grade.label;
    $('crumbGrade').href = $('backLink').href = `/class.html?grade=${grade.key}`;
    $('crumbSkill').textContent = `${skillId} ${skillName}`;
    $('skillTag').textContent = skillId;
    document.title = `${skillName} — Edubull`;

    let score = Number(localStorage.getItem(scoreKey)) || 0;
    let questions = [], index = 0, correct = 0, answered = 0;

    function setScore(next) {
      score = Math.max(0, Math.min(100, next));
      try { localStorage.setItem(scoreKey, score); } catch {}
      $('score').textContent = score;
      $('ring').style.setProperty('--p', score);
    }

    // Top up the server's question set with simple generated arithmetic.
    function generated(n) {
      const max = grade.key === 'lkg' || grade.key === 'ukg' ? 5 : grade.key === 'class-1' ? 10 : 50;
      return Array.from({ length: n }, (_, i) => {
        const a = 1 + Math.floor(Math.random() * max), b = 1 + Math.floor(Math.random() * max);
        const ans = a + b;
        const opts = new Set([ans]);
        while (opts.size < 4) opts.add(Math.max(0, ans + Math.floor(Math.random() * 7) - 3));
        return {
          id: `gen-${i}`, local: true, question: `What is ${a} + ${b}?`,
          options: [...opts].sort((x, y) => x - y).map(String), correctAnswer: String(ans),
          hint: `Start at ${a} and count on ${b} more.`, explanation: `${a} + ${b} = ${ans}.`
        };
      });
    }

    async function load() {
      let fromServer = [];
      try {
        const res = await apiClient.get(`/practice/${encodeURIComponent(skillId)}`);
        fromServer = res.questions || [];
      } catch (err) {
        console.warn('[practice] API unavailable, using generated questions', err);
      }
      questions = [...fromServer, ...generated(Math.max(0, SESSION_LENGTH - fromServer.length))].slice(0, SESSION_LENGTH);
      show();
    }

    function show() {
      const q = questions[index];
      $('bar').style.width = `${(index / questions.length) * 100}%`;
      $('qNum').textContent = `Question ${index + 1} of ${questions.length}`;
      $('stage').innerHTML = `
        <div class="q-text">${esc(q.question)}</div>
        <div class="options" id="opts">
          ${q.options.map((o, i) => `<button class="option" data-v="${esc(o)}"><kbd>${i + 1}</kbd>${esc(o)}</button>`).join('')}
        </div>
        <div class="feedback" id="fb" hidden></div>
        <div class="q-actions">
          <button class="btn btn-primary" id="submit" disabled>Check answer</button>
          ${q.hint ? '<button class="btn btn-ghost" id="hint">Show hint</button>' : ''}
        </div>`;

      let picked = null;
      const buttons = [...document.querySelectorAll('#opts .option')];
      buttons.forEach(b => b.addEventListener('click', () => {
        buttons.forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        picked = b.dataset.v;
        $('submit').disabled = false;
      }));
      $('hint')?.addEventListener('click', e => {
        const fb = $('fb');
        fb.hidden = false; fb.className = 'feedback info';
        fb.innerHTML = `<strong>Hint:</strong> ${esc(q.hint)}`;
        e.target.remove();
      });
      $('submit').addEventListener('click', () => check(q, picked, buttons));
      document.onkeydown = e => {
        const n = Number(e.key);
        if (n >= 1 && n <= buttons.length && !buttons[0].disabled) buttons[n - 1].click();
        if (e.key === 'Enter' && !$('submit')?.disabled) $('submit').click();
      };
    }

    async function check(q, picked, buttons) {
      if (picked == null) return;
      $('submit').disabled = true;
      let result;
      if (!q.local) {
        try {
          result = await apiClient.post('/practice/submit', { skillId, questionId: q.id, selectedAnswer: picked });
        } catch {}
      }
      if (!result) {
        const isCorrect = picked.trim().toLowerCase() === q.correctAnswer.trim().toLowerCase();
        result = { isCorrect, correctAnswer: q.correctAnswer, explanation: q.explanation, smartScoreIncrement: isCorrect ? 8 : -4 };
      }

      answered++;
      if (result.isCorrect) correct++;
      setScore(score + (result.smartScoreIncrement ?? (result.isCorrect ? 8 : -4)));
      $('tally').innerHTML = `${correct}<small> / ${answered} correct</small>`;

      buttons.forEach(b => {
        b.disabled = true;
        if (b.dataset.v === result.correctAnswer) b.classList.add('correct');
        else if (b.dataset.v === picked) b.classList.add('wrong');
      });
      const fb = $('fb');
      fb.hidden = false;
      fb.className = 'feedback ' + (result.isCorrect ? 'good' : 'bad');
      fb.innerHTML = (result.isCorrect ? '<strong>Correct!</strong>' : `<strong>Not quite.</strong> The answer is ${esc(result.correctAnswer)}.`)
        + (result.explanation ? `<small>${esc(result.explanation)}</small>` : '');

      $('hint')?.remove();
      const next = $('submit');
      next.textContent = index + 1 < questions.length ? 'Next question →' : 'See results';
      next.disabled = false;
      next.replaceWith(next.cloneNode(true));
      $('submit').addEventListener('click', () => {
        index++;
        index < questions.length ? show() : finish();
      });
      $('submit').focus();
    }

    function finish() {
      document.onkeydown = null;
      $('bar').style.width = '100%';
      $('qNum').textContent = 'Session complete';
      const pct = Math.round((correct / answered) * 100);
      $('stage').innerHTML = `
        <div class="done">
          <div class="big">${pct >= 80 ? '🏆' : pct >= 50 ? '👏' : '💪'}</div>
          <h2>${correct} of ${answered} correct</h2>
          <p class="muted">${score >= 100 ? 'Skill mastered. Brilliant work!' : `Your SmartScore is ${score}. Keep going to reach 100.`}</p>
          <div class="q-actions" style="justify-content:center">
            <button class="btn btn-primary" id="again">Practise again</button>
            <a class="btn btn-ghost" href="/class.html?grade=${grade.key}">Choose another skill</a>
          </div>
        </div>`;
      $('again').addEventListener('click', () => { index = correct = answered = 0; $('tally').innerHTML = '0<small> / 0 correct</small>'; load(); });
    }

    setScore(score);
    load();
  </script>
</body>
</html>
